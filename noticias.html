<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Notícias e histórias da atlética Devoradores e do curso de Nutrição."
    />
    <title>Notícias | Devoradores</title>
    <link rel="icon" href="assets/logo.png" type="image/png" />
    <link rel="stylesheet" href="assets/layout-final.css?v=22" />
    <link rel="stylesheet" href="assets/extras.css?v=1" />
    <script src="components/site-header.js"></script><script src="components/site-footer.js"></script><script defer src="assets/app.js"></script>
    <style>
      /* ==========================================================
         A Atlética — usa as mesmas cores do site (layout-final.css)
         Tudo é escopado em .atl para não afetar as outras páginas.
         ========================================================== */
      .atl {
        --atl-green: #103f2e;
        --atl-green-2: #1a5a43;
        --atl-gold: #ffd13e;
        --atl-gold-dark: #bd9112;
        --atl-ink: #203b31;
        --atl-muted: #5b6c64;
        --atl-line: #dce6de;
        --atl-pale: #f2f7f0;
        --atl-radius: 18px;
        --atl-ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      /* o main do site tem largura e margens próprias: aqui cada seção controla as suas */
      .atl main#main {
        max-width: none;
        width: 100%;
        padding: 0;
        margin: 0;
      }
      .atl .atl-section,
      .atl .atl-hero {
        margin: 0;
      }

      .atl-wrap {
        width: min(1120px, 100% - 40px);
        margin-inline: auto;
      }
      .atl-section {
        padding: clamp(56px, 9vw, 104px) 0;
      }
      .atl-section--tint {
        background: var(--atl-pale);
      }

      /* ---------- textos ---------- */
      .atl-eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 16px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--atl-green);
      }
      .atl-eyebrow::before {
        content: "";
        width: 26px;
        height: 3px;
        border-radius: 3px;
        background: var(--atl-gold);
      }
      .atl h1,
      .atl h2,
      .atl h3 {
        margin: 0;
        color: var(--atl-green);
      }
      .atl h2 {
        font-size: clamp(1.8rem, 3.6vw, 2.5rem);
      }
      .atl h3 {
        font-size: 1.1rem;
        letter-spacing: -0.3px;
      }

      .atl-lead {
        margin: 22px 0 0;
        max-width: 46ch;
        font-size: clamp(1.02rem, 1.6vw, 1.2rem);
        line-height: 1.6;
      }
      .atl-text {
        margin: 18px 0 0;
        max-width: 50ch;
        line-height: 1.7;
      }

      /* ---------- botões ---------- */
      .atl-btn {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 30px;
        padding: 14px 24px;
        border-radius: 8px;
        background: var(--atl-gold);
        color: #173527;
        font-size: 14px;
        font-weight: 700;
        transition:
          transform 0.3s var(--atl-ease),
          background 0.3s,
          box-shadow 0.3s;
      }
      .atl-btn svg {
        width: 18px;
        height: 18px;
        transition: transform 0.3s var(--atl-ease);
      }
      .atl-btn:hover {
        background: #ffe070;
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -12px rgba(189, 145, 18, 0.7);
      }
      .atl-btn:hover svg {
        transform: translate(3px, -3px);
      }

      /* ---------- HERO ---------- */
      .atl-hero {
        position: relative;
        overflow: hidden;
        padding: clamp(44px, 7vw, 88px) 0;
      }
      .atl-hero::before {
        content: "";
        position: absolute;
        width: 560px;
        height: 560px;
        right: -160px;
        top: -200px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 209, 62, 0.28),
          transparent 68%
        );
        animation: atl-float 9s ease-in-out infinite;
        pointer-events: none;
      }
      .atl-hero-grid {
        position: relative;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: clamp(28px, 6vw, 72px);
        align-items: center;
      }
      .atl-hero-media {
        position: relative;
      }
      .atl-hero-media img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 24px;
        box-shadow: 0 30px 60px -32px rgba(16, 63, 46, 0.5);
        animation: atl-float 7s ease-in-out infinite;
      }
      .atl-hero-media::after {
        content: "";
        position: absolute;
        inset: 16px -14px -14px 16px;
        border: 2px solid var(--atl-gold);
        border-radius: 24px;
        z-index: -1;
      }

      /* ---------- QUEM SOMOS ---------- */
      .atl-about {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(32px, 6vw, 80px);
        align-items: start;
      }
      .atl-values {
        display: grid;
        gap: 14px;
      }
      .atl-value {
        display: flex;
        gap: 18px;
        align-items: flex-start;
        padding: 20px 22px;
        background: #fff;
        border: 1px solid var(--atl-line);
        border-radius: var(--atl-radius);
        transition:
          transform 0.35s var(--atl-ease),
          box-shadow 0.35s,
          border-color 0.35s;
      }
      .atl-value:hover {
        transform: translateX(6px);
        border-color: var(--atl-green);
        box-shadow: 0 16px 32px -22px rgba(16, 63, 46, 0.5);
      }
      .atl-value p {
        margin: 4px 0 0;
        line-height: 1.5;
        font-size: 0.95rem;
      }

      /* ---------- ícones ---------- */
      .atl-icon {
        flex: none;
        display: grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: var(--atl-pale);
        color: var(--atl-green);
        transition:
          background 0.3s,
          color 0.3s,
          transform 0.4s var(--atl-ease);
      }
      .atl-icon svg {
        width: 26px;
        height: 26px;
      }
      .atl-value:hover .atl-icon {
        background: var(--atl-green);
        color: var(--atl-gold);
      }

      /* ---------- MODALIDADES ---------- */
      .atl-head {
        max-width: 560px;
        margin-bottom: clamp(32px, 5vw, 52px);
      }
      .atl-cards {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
      .atl-card {
        position: relative;
        padding: 28px 24px 26px;
        background: #fff;
        border: 1px solid var(--atl-line);
        border-radius: var(--atl-radius);
        overflow: hidden;
        transition:
          transform 0.4s var(--atl-ease),
          box-shadow 0.4s,
          border-color 0.4s;
      }
      .atl-card::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        height: 4px;
        width: 100%;
        background: var(--atl-gold);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.45s var(--atl-ease);
      }
      .atl-card h3 {
        margin-top: 22px;
      }
      .atl-card p {
        margin: 6px 0 0;
        font-size: 0.92rem;
      }
      .atl-card:hover {
        transform: translateY(-8px);
        border-color: transparent;
        box-shadow: 0 24px 40px -26px rgba(16, 63, 46, 0.55);
      }
      .atl-card:hover::after {
        transform: scaleX(1);
      }
      .atl-card:hover .atl-icon {
        background: var(--atl-green);
        color: var(--atl-gold);
        transform: rotate(-8deg) scale(1.06);
      }

      /* ---------- GESTÃO 2026 ---------- */
      .atl-team-head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
        margin-bottom: clamp(32px, 5vw, 52px);
      }
      .atl-year {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-radius: 999px;
        background: var(--atl-green);
        color: var(--atl-gold);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .atl-year svg {
        width: 18px;
        height: 18px;
      }
      .atl-team {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
      }
      .atl-member {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 16px 26px;
        overflow: hidden;
        background: #fff;
        border: 1px solid var(--atl-line);
        border-radius: var(--atl-radius);
        transition:
          transform 0.4s var(--atl-ease),
          box-shadow 0.4s;
      }
      .atl-member:hover {
        transform: translateY(-8px);
        box-shadow: 0 24px 40px -26px rgba(16, 63, 46, 0.55);
      }
      /* foto da diretoria: retrato da cabeça até os braços cruzados (camiseta da Nutrição visível) */
      .atl-photo {
        align-self: stretch;
        margin: 0 -16px 20px;
        aspect-ratio: 5 / 7;
        background: #0e3a28;
        overflow: hidden;
      }
      .atl-photo img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 45%;
        transition: transform 0.6s var(--atl-ease);
      }
      .atl-member:hover .atl-photo img {
        transform: scale(1.05);
      }

      /* avatar: troque o <svg> por <img class="atl-avatar-img"> quando tiver a foto */
      .atl-avatar {
        position: relative;
        display: grid;
        place-items: center;
        width: 104px;
        height: 104px;
        margin-bottom: 20px;
        border-radius: 50%;
        background: var(--atl-pale);
        color: var(--atl-green);
        box-shadow:
          0 0 0 4px #fff,
          0 0 0 7px var(--atl-gold);
        overflow: hidden;
        transition: transform 0.5s var(--atl-ease);
      }
      .atl-avatar svg {
        width: 46px;
        height: 46px;
      }
      .atl-avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .atl-member:hover .atl-avatar {
        transform: scale(1.06);
      }
      .atl-member h3 {
        margin: 0;
        font-size: 1.05rem;
      }
      .atl-role {
        display: inline-block;
        margin: 10px 0 0;
        padding: 5px 12px;
        border-radius: 999px;
        background: var(--atl-pale);
        color: var(--atl-green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.3px;
        text-transform: uppercase;
      }
      /* link do Instagram de cada integrante */
      .atl-insta {
        display: inline-grid;
        place-items: center;
        width: 40px;
        height: 40px;
        margin-top: 14px;
        border-radius: 50%;
        background: var(--atl-pale);
        color: var(--atl-green);
        transition:
          background 0.3s,
          color 0.3s,
          transform 0.3s var(--atl-ease);
      }
      .atl-insta svg {
        width: 20px;
        height: 20px;
      }
      .atl-insta:hover,
      .atl-insta:focus-visible {
        background: var(--atl-green);
        color: var(--atl-gold);
        transform: translateY(-3px);
      }
      .atl-member--lead .atl-insta {
        background: var(--atl-green-2);
        color: var(--atl-gold);
      }
      .atl-member--lead .atl-insta:hover,
      .atl-member--lead .atl-insta:focus-visible {
        background: var(--atl-gold);
        color: #173527;
      }

      /* destaque para a presidência */
      .atl-member--lead {
        background: var(--atl-green);
        border-color: var(--atl-green);
      }
      .atl-member--lead h3 {
        color: #fff;
      }
      .atl-member--lead .atl-role {
        background: var(--atl-gold);
        color: #173527;
      }
      .atl-member--lead .atl-avatar {
        background: var(--atl-green-2);
        color: var(--atl-gold);
        box-shadow:
          0 0 0 4px var(--atl-green),
          0 0 0 7px var(--atl-gold);
      }

      /* ---------- CTA ---------- */
      .atl-cta {
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        flex-wrap: wrap;
        padding: clamp(32px, 5vw, 56px);
        border-radius: 22px;
        border-top: 4px solid var(--atl-gold);
        background: var(--atl-green);
        color: #fff;
      }
      .atl-cta::after {
        content: "";
        position: absolute;
        width: 320px;
        height: 320px;
        right: -80px;
        top: -140px;
        border-radius: 50%;
        background: rgba(255, 209, 62, 0.12);
        animation: atl-float 8s ease-in-out infinite;
      }
      .atl-cta > * {
        position: relative;
        z-index: 1;
      }
      .atl-cta h2 {
        color: #fff;
      }
      .atl-cta p {
        margin: 10px 0 0;
        color: rgba(255, 255, 255, 0.8);
      }
      .atl-cta .atl-btn {
        margin-top: 0;
      }

      /* ---------- AÇÕES REALIZADAS (cards + galeria) ---------- */
      .acao-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 300px));
        gap: 24px;
        justify-content: start;
      }
      .acao-card {
        position: relative;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid var(--ex-line);
        border-radius: var(--ex-radius);
        overflow: hidden;
        transition:
          transform 0.4s var(--ex-ease),
          box-shadow 0.4s,
          border-color 0.4s;
      }
      .acao-card:hover {
        transform: translateY(-8px);
        border-color: transparent;
        box-shadow: 0 24px 40px -26px rgba(16, 63, 46, 0.55);
      }
      .acao-card:has(.acao-open:focus-visible) {
        outline: 3px solid #bd9112;
        outline-offset: 3px;
      }
      /* capa em 4:5 */
      .acao-cover {
        position: relative;
        aspect-ratio: 4 / 5;
        overflow: hidden;
        background: #0e3a28;
      }
      .acao-cover img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 50%;
        transition: transform 0.6s var(--ex-ease);
      }
      .acao-card:hover .acao-cover img {
        transform: scale(1.05);
      }
      .acao-count {
        position: absolute;
        left: 12px;
        top: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 11px;
        border-radius: 999px;
        background: rgba(16, 63, 46, 0.86);
        color: var(--ex-gold);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
      }
      .acao-count svg {
        width: 14px;
        height: 14px;
      }
      .acao-body {
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex: 1;
        padding: 20px 20px 22px;
      }
      .acao-date {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: #967005;
      }
      .ex-sec .acao-card h3 {
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.2;
      }
      .acao-open {
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        font-weight: inherit;
        letter-spacing: inherit;
        text-align: left;
        cursor: pointer;
      }
      .acao-open::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 1;
      } /* card inteiro clicável */
      .acao-card p.acao-desc {
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.6;
        color: var(--ex-muted);
      }
      .acao-more {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: auto;
        padding-top: 8px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ex-green);
      }
      .acao-more svg {
        width: 16px;
        height: 16px;
        transition: transform 0.3s var(--ex-ease);
      }
      .acao-card:hover .acao-more svg {
        transform: translate(3px, -3px);
      }

      /* modal da galeria */
      dialog.acao-dialog {
        --ex-green: #103f2e;
        --ex-green-2: #1a5a43;
        --ex-gold: #ffd13e;
        --ex-muted: #5b6c64;
        --ex-pale: #f2f7f0;
        --ex-line: #dce6de;
        --ex-ease: cubic-bezier(0.22, 1, 0.36, 1);
        width: min(1040px, calc(100% - 28px));
        max-height: 92vh;
        padding: 0;
        border: 0;
        border-radius: 22px;
        overflow: hidden;
        background: #fff;
      }
      dialog.acao-dialog::backdrop {
        background: rgba(12, 43, 36, 0.72);
      }
      .acao-modal {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        max-height: 92vh;
      }
      .acao-gallery {
        padding: 20px;
        background: var(--ex-green);
        overflow: auto;
        align-content: center;
      }
      .acao-stage {
        position: relative;
        aspect-ratio: 3 / 2;
        overflow: hidden;
        border-radius: 14px;
        background: #0b2e21;
        touch-action: pan-y;
      }
      .acao-stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .acao-nav {
        position: absolute;
        top: 50%;
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        margin-top: -21px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: var(--ex-green);
        transition:
          background 0.25s,
          transform 0.25s var(--ex-ease);
      }
      .acao-nav:hover {
        background: var(--ex-gold);
        transform: scale(1.08);
      }
      .acao-nav svg {
        width: 22px;
        height: 22px;
      }
      .acao-prev {
        left: 12px;
      }
      .acao-next {
        right: 12px;
      }
      .acao-counter {
        position: absolute;
        left: 12px;
        bottom: 12px;
        padding: 5px 12px;
        border-radius: 999px;
        background: rgba(16, 63, 46, 0.86);
        color: var(--ex-gold);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .acao-thumbs {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
        gap: 8px;
        margin-top: 12px;
      }
      .acao-thumb {
        padding: 0;
        aspect-ratio: 3 / 2;
        overflow: hidden;
        border: 2px solid transparent;
        border-radius: 8px;
        background: #0b2e21;
        opacity: 0.6;
        transition:
          opacity 0.25s,
          border-color 0.25s;
      }
      .acao-thumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .acao-thumb:hover {
        opacity: 1;
      }
      .acao-thumb[aria-current="true"] {
        opacity: 1;
        border-color: var(--ex-gold);
      }
      .acao-info {
        padding: 40px 32px 32px;
        overflow: auto;
      }
      .acao-info .eyebrow-line {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 14px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--ex-green);
      }
      .acao-info .eyebrow-line::before {
        content: "";
        width: 26px;
        height: 3px;
        border-radius: 3px;
        background: var(--ex-gold);
      }
      .acao-info h2 {
        margin: 0 0 14px;
        font-size: clamp(1.5rem, 2.6vw, 2rem);
        letter-spacing: -0.8px;
      }
      .acao-info .acao-when {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 20px;
        font-size: 14px;
        font-weight: 700;
        color: #967005;
      }
      .acao-info .acao-when svg {
        width: 18px;
        height: 18px;
      }
      .acao-info p {
        margin: 0 0 14px;
        font-size: 0.96rem;
        line-height: 1.7;
      }
      .acao-info h3 {
        margin: 22px 0 10px;
        font-size: 0.8rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .acao-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 24px;
        padding: 0;
        list-style: none;
      }
      .acao-chips li {
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--ex-pale);
        color: var(--ex-green);
        font-size: 12px;
        font-weight: 700;
      }
      .acao-info .ex-btn {
        margin-top: 4px;
      }
      dialog.acao-dialog .acao-close {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 3;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 50%;
        background: #fff;
        color: var(--ex-green);
        font-size: 26px;
        line-height: 1;
        box-shadow: 0 6px 18px -8px rgba(0, 0, 0, 0.5);
        transition:
          background 0.25s,
          transform 0.25s var(--ex-ease);
      }
      dialog.acao-dialog .acao-close:hover {
        background: var(--ex-gold);
        transform: rotate(90deg);
      }
      @media (max-width: 860px) {
        dialog.acao-dialog {
          overflow: auto;
        }
        .acao-modal {
          grid-template-columns: 1fr;
          max-height: none;
        }
        .acao-gallery {
          padding: 14px;
          overflow: visible;
          align-content: start;
        }
        .acao-info {
          padding: 26px 22px 28px;
          overflow: visible;
        }
      }
      @media (max-width: 460px) {
        .acao-grid {
          grid-template-columns: 1fr;
        }
      }

      /* ---------- animações ---------- */
      @keyframes atl-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      @keyframes atl-rise {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      .atl-hero-grid > * {
        animation: atl-rise 0.9s var(--atl-ease) both;
      }
      .atl-hero-grid > *:nth-child(2) {
        animation-delay: 0.15s;
      }

      .atl-js [data-reveal] {
        opacity: 0;
        transform: translateY(28px);
        transition:
          opacity 0.8s var(--atl-ease),
          transform 0.8s var(--atl-ease);
        transition-delay: var(--d, 0s);
      }
      .atl-js [data-reveal].is-visible {
        opacity: 1;
        transform: none;
      }

      /* ---------- responsivo ---------- */
      @media (max-width: 960px) {
        .atl-cards,
        .atl-team {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 760px) {
        .atl-hero-grid,
        .atl-about {
          grid-template-columns: 1fr;
        }
        .atl-hero-media {
          order: -1;
          max-width: 420px;
        }
        .atl-cta {
          flex-direction: column;
          align-items: flex-start;
        }
      }
      @media (max-width: 460px) {
        .atl-cards {
          grid-template-columns: 1fr;
        }
        .atl-team {
          gap: 12px;
        }
        .atl-member {
          padding: 0 10px 20px;
        }
        .atl-photo {
          margin: 0 -10px 16px;
        }
        .atl-member h3 {
          font-size: 0.95rem;
        }
        .atl-role {
          font-size: 10px;
          letter-spacing: 1px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .atl *,
        .atl *::before,
        .atl *::after {
          animation: none !important;
          transition: none !important;
        }
        .atl-js [data-reveal] {
          opacity: 1;
          transform: none;
        }
      }

    <script>
      // Ações realizadas: cards + galeria de fotos
      (function () {
        var ACOES = (window.DEVORADORES_UNIFEV_SNAPSHOT || []).slice();
        ACOES.sort(function (a, b) {
          return b.data.localeCompare(a.data);
        });
        var categoria = "todas",
          busca = "",
          filtradas = ACOES;
        function normalizar(t) {
          return String(t)
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .toLowerCase();
        }
        function filtrar() {
          filtradas = ACOES.filter(function (a) {
            return (
              (categoria === "todas" ||
                a.categorias.indexOf(categoria) !== -1) &&
              normalizar(
                a.titulo + " " + a.resumo + " " + a.descricao.join(" "),
              ).indexOf(busca) !== -1
            );
          });
          page = 0;
          renderPage();
        }

        var ICON_CAM =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>';
        var ICON_ARROW =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>';
        var ICON_CAL =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>';

        var grid = document.getElementById("acoes-grid");
        var dlg = document.getElementById("acao-dialog");
        if (!grid || !dlg || typeof dlg.showModal !== "function") return;

        var img = document.getElementById("acao-img");
        var counter = document.getElementById("acao-counter");
        var thumbs = document.getElementById("acao-thumbs");
        var info = document.getElementById("acao-info");
        var stage = document.getElementById("acao-stage");
        var cur = null,
          idx = 0,
          opener = null,
          galleryRequest = null;
        var galleryStatus = document.getElementById("news-gallery-status");

        function esc(t) {
          return String(t).replace(/[&<>"]/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
          });
        }

        // ---- cards ----
        var page = 0,
          pageSize = 9;
        var pagination = document.getElementById("acoes-pagination");
        function renderPage() {
          grid.innerHTML = filtradas
            .slice(page * pageSize, (page + 1) * pageSize)
            .map(function (a, localIndex) {
              var i = ACOES.indexOf(a);
              return (
                '<article class="acao-card" data-reveal style="--d:' +
                i * 0.08 +
                's">' +
                '<div class="acao-cover">' +
                (a.capa
                  ? '<img src="' +
                    esc(a.capa) +
                    '" alt="' +
                    esc(a.titulo) +
                    '" loading="lazy" decoding="async" />'
                  : '<span class="news-cover-empty">Unifev</span>') +
                '<span class="acao-count">' +
                ICON_CAM +
                a.fotos.length +
                " fotos</span>" +
                "</div>" +
                '<div class="acao-body">' +
                '<p class="acao-date"><time datetime="' +
                a.data +
                '">' +
                esc(a.dataTexto) +
                "</time></p>" +
                "<h3>" +
                esc(a.titulo) +
                "</h3>" +
                '<p class="acao-desc">' +
                esc(a.resumo) +
                "</p>" +
                '<button type="button" class="acao-more acao-open" data-i="' +
                i +
                '" aria-haspopup="dialog" aria-label="Ver notícia: ' +
                esc(a.titulo) +
                '">Ver notícia ' +
                ICON_ARROW +
                "</button>" +
                "</div>" +
                "</article>"
              );
            })
            .join("");

          var pages = Math.ceil(filtradas.length / pageSize);
          pagination.hidden = pages <= 1;
          document.getElementById("news-empty").hidden = filtradas.length !== 0;
          document.getElementById("news-results").textContent =
            filtradas.length +
            (filtradas.length === 1
              ? " notícia encontrada"
              : " notícias encontradas");
          document.getElementById("acoes-page-label").textContent =
            page + 1 + " / " + pages;
          document.getElementById("acoes-page-prev").disabled = page === 0;
          document.getElementById("acoes-page-next").disabled =
            page >= pages - 1;
          grid.querySelectorAll("[data-reveal]").forEach(function (el) {
            el.classList.add("is-visible");
          });
        }
        renderPage();
        document.querySelectorAll("[data-news-category]").forEach(function (b) {
          b.addEventListener("click", function () {
            categoria = b.dataset.newsCategory;
            document
              .querySelectorAll("[data-news-category]")
              .forEach(function (item) {
                item.setAttribute(
                  "aria-pressed",
                  item === b ? "true" : "false",
                );
              });
            filtrar();
          });
        });
        (document.getElementById("news-search") || { addEventListener: function () {} }).addEventListener("input", function (e) {
            busca = normalizar(e.target.value.trim());
            filtrar();
          });
        function changePage(delta) {
          page = Math.max(
            0,
            Math.min(Math.ceil(filtradas.length / pageSize) - 1, page + delta),
          );
          renderPage();
          grid.scrollIntoView({ behavior: "smooth", block: "start" });
        }
        document.getElementById("acoes-page-prev").onclick = function () {
          changePage(-1);
        };
        document.getElementById("acoes-page-next").onclick = function () {
          changePage(1);
        };

        document.addEventListener("unifev-noticias", function (e) {
          if (!Array.isArray(e.detail)) return;
          e.detail.forEach(function (a) {
            var existing = ACOES.find(function (x) {
              return x.fonte && x.fonte.url === a.fonte.url;
            });
            if (existing) {
              if (existing.origem === "unifev") {
                var photos = existing.fotos;
                Object.assign(existing, a);
                existing.fotos = photos;
              }
            } else {
              ACOES.push(a);
            }
          });
          ACOES.sort(function (a, b) {
            return b.data.localeCompare(a.data);
          });
          // Mantém a página e os filtros durante a atualização em segundo plano.
          filtradas = ACOES.filter(function (a) {
            return (
              (categoria === "todas" ||
                a.categorias.indexOf(categoria) !== -1) &&
              normalizar(
                a.titulo + " " + a.resumo + " " + a.descricao.join(" "),
              ).indexOf(busca) !== -1
            );
          });
          renderPage();
        });
        // ---- galeria ----
        function setPhoto(n) {
          var f = cur && cur.fotos;
          if (!f || !f.length) return;
          idx = (n + f.length) % f.length;
          img.src = cur.pasta + f[idx][0];
          img.alt = f[idx][1];
          counter.textContent = idx + 1 + " / " + f.length;
          var btns = thumbs.children;
          for (var k = 0; k < btns.length; k++) {
            btns[k].setAttribute("aria-current", k === idx ? "true" : "false");
          }
        }

        function openAcao(i, from) {
          cur = ACOES[i];
          opener = from;
          if (galleryRequest) galleryRequest.abort();
          galleryRequest = new AbortController();
          var selected = cur,
            request = galleryRequest;
          cur.fotos = cur.capa ? [[cur.capa, cur.titulo]] : [];
          renderGallery();
          galleryStatus.textContent = "Carregando fotos…";
          info.innerHTML =
            '<p class="eyebrow-line">Notícia · Unifev</p>' +
            '<h2 id="acao-dlg-title">' +
            esc(cur.titulo) +
            "</h2>" +
            '<p class="acao-when">' +
            ICON_CAL +
            '<time datetime="' +
            cur.data +
            '">' +
            esc(cur.dataTexto) +
            "</time></p>" +
            cur.descricao
              .map(function (t) {
                return "<p>" + esc(t) + "</p>";
              })
              .join("") +
            (cur.entidades && cur.entidades.length
              ? '<h3>Entidades atendidas</h3><ul class="acao-chips">' +
                cur.entidades
                  .map(function (e) {
                    return "<li>" + esc(e) + "</li>";
                  })
                  .join("") +
                "</ul>"
              : "") +
            (cur.fonte
              ? '<a class="ex-btn" href="' +
                esc(cur.fonte.url) +
                '" target="_blank" rel="noopener noreferrer">' +
                esc("Ler reportagem completa na Unifev") +
                " " +
                ICON_ARROW +
                "</a>"
              : "");
          info.scrollTop = 0;
          document.querySelector(".acao-gallery").scrollTop = 0;
          setPhoto(0);
          stage.hidden = true;
          dlg.showModal();
          dlg.scrollTop = 0;
          var loader =
            window.DevoradoresUnifev && window.DevoradoresUnifev.loadGallery;
          if (!loader) {
            galleryStatus.textContent =
              "As fotos estão disponíveis na reportagem original.";
            return;
          }
          loader(selected, galleryRequest.signal)
            .then(function (fotos) {
              if (
                cur !== selected ||
                !dlg.open ||
                galleryRequest !== request ||
                request.signal.aborted
              )
                return;
              cur.fotos = fotos;
              renderGallery();
              galleryStatus.textContent = fotos.length
                ? ""
                : "Esta reportagem não possui fotos disponíveis.";
            })
            .catch(function (error) {
              if (
                cur !== selected ||
                !dlg.open ||
                galleryRequest !== request ||
                request.signal.aborted ||
                error.name === "AbortError"
              )
                return;
              galleryStatus.textContent =
                "Não foi possível carregar outras fotos. Você pode vê-las na reportagem original.";
            });
        }

        function renderGallery() {
          thumbs.innerHTML = cur.fotos
            .map(function (f, k) {
              return (
                '<button type="button" class="acao-thumb" data-k="' +
                k +
                '" aria-label="Ver foto ' +
                (k + 1) +
                '"><img src="' +
                esc(f[0]) +
                '" alt="' +
                esc(f[1]) +
                '" loading="lazy" decoding="async" /></button>'
              );
            })
            .join("");
          setPhoto(0);
        }

        grid.addEventListener("click", function (e) {
          var b = e.target.closest(".acao-open");
          if (b) openAcao(Number(b.dataset.i), b);
        });
        thumbs.addEventListener("click", function (e) {
          var b = e.target.closest(".acao-thumb");
          if (b) {
            stage.hidden = false;
            setPhoto(Number(b.dataset.k));
            stage.scrollIntoView({ behavior: "smooth", block: "start" });
          }
        });
        document.getElementById("acao-prev").onclick = function () {
          setPhoto(idx - 1);
        };
        document.getElementById("acao-next").onclick = function () {
          setPhoto(idx + 1);
        };
        document.getElementById("acao-close").onclick = function () {
          dlg.close();
        };
        dlg.addEventListener("click", function (e) {
          if (e.target === dlg) dlg.close();
        });
        dlg.addEventListener("close", function () {
          if (galleryRequest) galleryRequest.abort();
          if (opener) opener.focus();
        });
        dlg.addEventListener("keydown", function (e) {
          if (e.key === "ArrowLeft") {
            setPhoto(idx - 1);
          } else if (e.key === "ArrowRight") {
            setPhoto(idx + 1);
          }
        });

        // deslizar o dedo na foto (celular)
        var x0 = null;
        stage.addEventListener("pointerdown", function (e) {
          x0 = e.clientX;
        });
        stage.addEventListener("pointerup", function (e) {
          if (x0 === null) return;
          var dx = e.clientX - x0;
          x0 = null;
          if (Math.abs(dx) > 45) setPhoto(idx + (dx < 0 ? 1 : -1));
        });
        stage.addEventListener("pointercancel", function () {
          x0 = null;
        });
      })();
    </script>
    <script>
      // Animação de entrada ao rolar a página (A Atlética)
      (function () {
        var items = document.querySelectorAll("[data-reveal]");
        if (!items.length) return;

        var reduce = window.matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;
        if (reduce || !("IntersectionObserver" in window)) return;

        document.documentElement.classList.add("atl-js");

        var io = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                io.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.15, rootMargin: "0px 0px -40px 0px" },
        );

        items.forEach(function (el) {
          io.observe(el);
        });
      })();
    </script>
